[project]
name = "AquaHub Climate"
development_version = "0.4.0"
methodology_status = "provisional"

[historical]
dataset = "CHELSA-W5E5"
period = "1981-2010"
spatial_resolution = "30 arcsec (~1 km)"

[future]
# PROPOSAL pending confirmation with the research team (see
# docs/02_methodological_questions_for_team.md and docs/04, Track A).
# This is the "monthly, 5-GCM" option: the official CHELSA v2.1 future
# climatologies product, at the same ~1km resolution and downscaling
# methodology as the historical baseline above. It is monthly, not
# daily - see docs/04 for why that trade-off was chosen and what it
# means for frost/chilling indices later.
dataset = "CHELSA-climatologies-v2.1-CMIP6"
model_set = "CHELSA-v2.1-standard-5"
temporal_resolution = "monthly"
# 2011-2040 was deliberately dropped (Sept 2026, user decision, see
# docs/04 Section 2.1/3) - not part of the project's future-period
# scope at all, not just undelivered by the professor yet.
periods = [
    "2041-2070",
    "2071-2100"
]
# Only the conservative/extreme bracket (SSP1-2.6, SSP5-8.5) - the
# middle SSP3-7.0 scenario was deliberately dropped (Sept 2026, see
# docs/04 Section 3) to cut acquisition volume by a third and keep the
# platform's future-scenario comparison to a clear two-line bracket.
scenarios = [
    "ssp126",
    "ssp585"
]

[models]
# PROPOSAL pending confirmation with the research team - the 5 GCMs
# standardised by CHELSA v2.1 (matches [future].model_set above).
# Not yet approved by the professor.
gcms = [
    "GFDL-ESM4",
    "IPSL-CM6A-LR",
    "MPI-ESM1-2-HR",
    "MRI-ESM2-0",
    "UKESM1-0-LL"
]

[variables]
core = [
    "tas",
    "tasmin",
    "tasmax",
    "pr"
]

optional = [
    "rsds",
    "pet",
    "cmi"
]

[ensemble]
method = "equal_weight_mean"
uncertainty_metrics = [
    "min",
    "max",
    "std"
]

[processing]
preserve_rasters = true
calculate_municipal_statistics = true
calculate_anomalies = true
preserve_individual_gcm_results = true

[pilot]
# Configuration for the future-climate experiment scaffold
# (src/future_climate_experiment.py). Not used by the interactive
# platform below.
region_type = "NUTS3"
region_name = "Douro"
variable = "tas"
scenario = "ssp585"
period = "2041-2070"

# Deliberately empty until availability and methodology are confirmed
gcm = ""

[pilot_platform]
# Configuration for the interactive pilot platform
# (scripts/build_pilot_region.py + api/ + web/).
#
# v1 deliberately shows only the validated historical baseline.
# Future SSP/GCM scenarios are not included until the items above
# are confirmed with the research team (see
# docs/02_methodological_questions_for_team.md).
#
# Shared across every configured region below - v1 only has 'tas'
# validated against real CHELSA data.
variable = "tas"
period = "1981-2010"
dataset = "CHELSA climatologies v2.1"

# Each entry is one selectable region in the platform. 'nuts3_names'
# is a list because an AquaHub intervention area does not always
# correspond to a single official NUTS III unit (see docs/03).
[[pilot_platform.regions]]
slug = "douro"
label = "Douro"
nuts3_names = ["Douro"]

[[pilot_platform.regions]]
slug = "beira-interior"
label = "Beira Interior"
# INFERRED, not yet confirmed against the official AquaHub area
# definition - CAOP2025 uses Portugal's revised (2024) NUTS III
# classification, which has no literal "Beira Interior" unit. The old
# "Beira Interior Norte" + "Beira Interior Sul" + "Cova da Beira"
# (pre-2024 classification) were consolidated into "Beiras e Serra da
# Estrela" and "Beira Baixa" in the revision, which is the combination
# used here. If the AquaHub project's actual intervention boundary is
# narrower/different, adjust this list accordingly.
nuts3_names = ["Beira Baixa", "Beiras e Serra da Estrela"]

[[pilot_platform.regions]]
slug = "tras-os-montes"
label = "Terras de Trás-os-Montes"
nuts3_names = ["Terras de Trás-os-Montes"]

# The two Spanish zones confirmed by the professor's sketch (Sept 2026)
# are whole NUTS II autonomous communities, not municipality-level like
# the Portuguese regions above - so they are NOT built by
# scripts/build_pilot_region.py (which only knows the CAOP/NUTS III
# path; leaving nuts3_names unset makes it skip these two cleanly).
# Boundary source: Eurostat GISCO (see docs/03 Section 7,
# src/gisco_boundary_processing.py), identified by NUTS_ID (confirmed
# locally against the real GISCO NUTS_RG_01M_2024_4326.gpkg file, Sept
# 2026) rather than nuts3_names. Wiring these into an actual build
# script (zonal-stats aggregation of CHELSA over the whole region
# polygon, not per-municipality) is part of the deferred zone-map
# redesign, not yet implemented.
[[pilot_platform.regions]]
slug = "castilla-y-leon"
label = "Castilla y León"
gisco_nuts_ids = ["ES41"]

[[pilot_platform.regions]]
slug = "extremadura"
label = "Extremadura"
gisco_nuts_ids = ["ES43"]
