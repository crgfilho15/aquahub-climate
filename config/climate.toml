[project]
name = "AquaHub Climate"
development_version = "0.3.0"
methodology_status = "provisional"

[historical]
dataset = "CHELSA-W5E5"
period = "1981-2010"
spatial_resolution = "30 arcsec (~1 km)"

[future]
dataset = "CHELSA-climatologies-v2.1-CMIP6"
model_set = "ISIMIP3b"
periods = [
    "2011-2040",
    "2041-2070",
    "2071-2100"
]
scenarios = [
    "ssp126",
    "ssp370",
    "ssp585"
]

[models]
# Definitive GCM list will be confirmed with the research team
gcms = []

[variables]
core = [
    "tas",
    "tasmin",
    "tasmax",
    "pr"
]

optional = [
    "rsds",
    "pet",
    "cmi"
]

[ensemble]
method = "equal_weight_mean"
uncertainty_metrics = [
    "min",
    "max",
    "std"
]

[processing]
preserve_rasters = true
calculate_municipal_statistics = true
calculate_anomalies = true
preserve_individual_gcm_results = true

[pilot]
# Configuration for the future-climate experiment scaffold
# (src/future_climate_experiment.py). Not used by the interactive
# platform below.
region_type = "NUTS3"
region_name = "Douro"
variable = "tas"
scenario = "ssp370"
period = "2041-2070"

# Deliberately empty until availability and methodology are confirmed
gcm = ""

[pilot_platform]
# Configuration for the interactive pilot platform
# (scripts/build_pilot_douro.py + api/ + web/).
#
# v1 deliberately shows only the validated historical baseline.
# Future SSP/GCM scenarios are not included until the dataset,
# GCM set and temporal resolution are confirmed with the research
# team (see docs/02_methodological_questions_for_team.md).
region_type = "NUTS3"
region_name = "Douro"
variable = "tas"
period = "1981-2010"
dataset = "CHELSA climatologies v2.1"
