<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AquaHub Climate — Piloto</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="banner">
    <div id="banner-heading">
      <h1>AquaHub Climate — Piloto</h1>
      <label id="region-select-wrapper">
        Região:
        <select id="region-select" disabled>
          <option value="">a carregar...</option>
        </select>
      </label>
      <label id="period-select-wrapper">
        Período:
        <select id="period-select" disabled>
          <option value="historical">Histórico (1981-2010)</option>
        </select>
      </label>
    </div>
    <p id="banner-subtitle">a carregar metadados...</p>
    <p id="banner-warning" class="pilot-warning" hidden></p>
  </header>

  <main>
    <div id="map"></div>

    <aside id="panel">
      <div id="panel-empty">
        <p>Clique num município no mapa para ver a sua climatologia.</p>
      </div>
      <div id="panel-content" hidden>
        <h2 id="panel-name"></h2>
        <p id="panel-annual"></p>
        <p id="panel-anomaly" class="pilot-anomaly" hidden></p>
        <svg id="panel-chart" viewBox="0 0 360 180" width="100%" height="180"></svg>
        <p id="panel-source"></p>
      </div>
    </aside>
  </main>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
